[project]
name = "vision-caption"
version = "0.1.0"
description = "Audio-descrizione ambientale in tempo reale per utenti ciechi/ipovedenti"
authors = [{ name = "Samuel Arenella" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "vision-commons",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "websockets>=12.0",
    "chatterbox-tts>=0.1.0",
    "torchaudio>=2.3.0",
]

[project.scripts]
vision-caption = "vision_caption.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
    "httpx>=0.27.0",
]

[tool.uv.sources]
vision-commons = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_caption"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/vision_caption --cov-report=term-missing -v"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
[[tool.mypy.overrides]]
module = ["chatterbox.*", "torchaudio.*"]
ignore_missing_imports = true
