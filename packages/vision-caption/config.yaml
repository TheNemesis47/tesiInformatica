server:
  host: "0.0.0.0"
  port: 8765
  max_connections: 1

camera:
  resolution_width: 1280
  resolution_height: 960
  jpeg_quality: 75
  frame_send_interval_ms: 500

scene_detection:
  ssim_threshold: 0.85
  semantic_threshold: 0.3
  min_caption_interval_sec: 3.0
  rfdetr_model_size: "small"
  rfdetr_confidence: 0.25

vlm:
  model_name: "google/gemma-4-26b-a4b-it"
  runtime: "openrouter"
  api_key: "apikey"
  temperature: 0.3
  max_tokens: 100
  language: "it"

tts:
  api_url: "http://localhost:4123"
  model: "chatterbox-turbo"
  language: "it"
  output_format: "wav"

gestures:
  pointing_debounce_ms: 1500
  pointing_cooldown_ms: 2000
  pointing_crop_size: 320

logging:
  level: "INFO"
  save_frames: false
  save_captions: true
  log_latency: true
