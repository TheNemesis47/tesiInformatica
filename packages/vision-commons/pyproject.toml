[project]
name = "vision-commons"
version = "0.1.0"
description = "Componenti condivisi per i progetti di tesi Meta Quest 3 — scene detection, frame acquisition, VLM client"
authors = [{ name = "Samuel Arenella" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "structlog>=24.0",
    "pydantic>=2.0",
    # AI/ML — usati solo negli adapter
    "rfdetr>=0.1.0",
    "scikit-image>=0.22.0",
    "opencv-python-headless>=4.9.0",
    "ollama>=0.3.0",
    "torch>=2.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0",
    "mypy>=1.10.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_commons"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
[[tool.mypy.overrides]]
module = ["cv2.*", "skimage.*", "rfdetr.*", "ollama.*"]
ignore_missing_imports = true
