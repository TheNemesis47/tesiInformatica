[project]
name = "object-memory"
version = "0.1.0"
description = "Memoria visiva degli oggetti — cataloga e localizza oggetti tramite Meta Quest 3"
authors = [{ name = "Samuel Arenella" }]
requires-python = ">=3.14"
dependencies = [
    "vision-commons",
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.46.0",
    "pydantic>=2.13",
    "pydantic-settings>=2.6",
    "structlog>=25.0",
    "pyyaml>=6.0",
    "websockets>=14.0",
    "aiosqlite>=0.20.0",
    "pillow>=11.0",
]

[project.scripts]
object-memory = "object_memory.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0",
    "mypy>=1.13.0",
    "ruff>=0.8.0",
    "httpx>=0.28.0",
]

[tool.uv.sources]
vision-commons = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/object_memory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/object_memory --cov-report=term-missing -v"

[tool.mypy]
python_version = "3.14"
strict = true
warn_return_any = true
[[tool.mypy.overrides]]
module = ["aiosqlite.*", "PIL.*"]
ignore_missing_imports = true
